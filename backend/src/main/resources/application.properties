# ===================================================================
# Pet Adoption Management System - Application Configuration
# ===================================================================

spring.application.name=pet-adoption-backend
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_adoption?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tharan@1237}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ===================================================================
# Email Configuration
# ===================================================================
app.email.enabled=${EMAIL_ENABLED:false}
app.email.host=${EMAIL_HOST:smtp.mailgun.org}
app.email.port=${EMAIL_PORT:587}
app.email.username=${EMAIL_USERNAME:}
app.email.password=${EMAIL_PASSWORD:}
app.email.from=${EMAIL_FROM:noreply@petadoption.org}

# ===================================================================
# Swagger / OpenAPI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.examly.springapp=DEBUG
logging.level.org.springframework.security=INFO
